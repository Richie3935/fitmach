<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>
    <header>
        <h1>FashionCompare</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/shop">Shop</a>
            <a href="/signup">Sign Up</a>
        </nav>
    </header>
    
    <main class="auth-form">
        <h2>Sign In</h2>
        {% if error %}
        <p class="save-status warning">{{ error }}</p>
        {% endif %}
        <form action="/account" method="post">
            <input type="email" name="email" placeholder="Email" required style="display: block; margin-bottom: 1rem; width: 100%;">
            <input type="password" name="password" placeholder="Password" required style="display: block; margin-bottom: 1rem; width: 100%;">
            <button type="submit" style="width: 100%;">Sign In</button>
        </form>
        <p style="margin-top: 1rem;">Don't have an account? <a href="/signup">Sign up</a></p>
    </main>
</body>
</html>
